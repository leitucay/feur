<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Rent | FEU CANTEEN</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/canteen_motion.css">
    <style>
        .inventory-page{padding:32px 42px;max-width:1600px;margin:auto}
        .inventory-heading{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:24px}
        .inventory-heading h2{margin-top:7px;font-family:"Playfair Display",Georgia,serif;font-size:36px;letter-spacing:-1px}
        .inventory-heading p{margin-top:7px;color:#7d869a;font-size:12px}
        .inventory-refresh{min-height:42px;padding:0 18px;border:1px solid rgba(255,255,255,.09);border-radius:10px;background:rgba(255,255,255,.045);color:#D4AF37;font-size:10px;font-weight:700;cursor:pointer;transition:.25s}
        .inventory-refresh:hover{background:rgba(255,255,255,.09);transform:translateY(-2px)}
        .inventory-stats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:18px}
        .inventory-stat{padding:18px;border:1px solid rgba(255,255,255,.08);border-radius:15px;background:rgba(255,255,255,.045);font-size:9px;letter-spacing:1px}
        .inventory-stat-value{margin-top:8px;color:#f5f5f8;font-size:24px;font-weight:700}
        .inventory-stat-small{margin-top:4px;color:#626b7f;font-size:9px}
        .inventory-panel{padding:22px;border:1px solid rgba(255,255,255,.08);border-radius:18px;background:rgba(255,255,255,.045);gap:10px;margin-bottom:20px}
        .inventory-search{flex:1;height:44px;padding:0 15px;border:1px solid rgba(255,255,255,.09);border-radius:10px;outline:none;background:rgba(255,255,255,.055);color:#fff;font-size:12px}
        .inventory-search::placeholder{color:#697287}
        .inventory-filter{width:160px;padding:0 12px;border:1px solid rgba(255,255,255,.09);border-radius:10px;outline:none;background:#171a28;color:#fff;font-size:11px}
        .history-button{height:44px;padding:0 16px;border:1px solid rgba(212,175,55,.18);border-radius:10px;background:rgba(212,175,55,.07);color:#D4AF37;font-size:10px;font-weight:700;cursor:pointer}
        .inventory-table{width:100%;border-collapse:collapse}
        .inventory-table th{padding:13px 10px;border-bottom:1px solid rgba(255,255,255,.08);color:#687186;text-align:left;font-size:9px;letter-spacing:1px;text-transform:uppercase}
        .inventory-table td{padding:13px 10px;border-bottom:1px solid rgba(255,255,255,.055);color:#b9c0cf;font-size:11px}
        .inventory-table tbody tr{transition:.25s}
        .inventory-table tbody tr:hover{background:rgba(255,255,255,.025)}
        .inventory-table tr:last-child td{border-bottom:none}
        .inventory-product{display:flex;align-items:center;gap:11px}
        .inventory-image{width:48px;height:48px;display:flex;align-items:center;justify-content:center;flex-shrink:0;overflow:hidden;border-radius:11px;background:radial-gradient(circle at 50% 35%,rgba(212,175,55,.16),transparent 55%),rgba(255,255,255,.045);font-size:22px}
        .inventory-image img{width:100%;height:100%;object-fit:cover}
        .inventory-product-name strong{display:block;color:#f4f5f8;font-size:11px}
        .inventory-product-name span{display:block;margin-top:4px;color:#626b7f;font-size:9px}
        .inventory-category{display:inline-flex;padding:5px 8px;border-radius:7px;background:rgba(212,175,55,.08);color:#D4AF37;font-size:8px;font-weight:700;text-transform:capitalize}
        .inventory-price,.stock-number{color:#fff;font-weight:700}
        .status-badge{display:inline-flex;padding:5px 8px;border-radius:7px;font-size:8px;font-weight:700}
        .status-badge.good{background:rgba(110,231,183,.08);color:#6ee7b7}
        .status-badge.low{background:rgba(251,191,36,.08);color:#fbbf24}
        .status-badge.out{background:rgba(251,113,133,.08);color:#fb7185}
        .stock-adjust{display:flex;gap:5px}
        .adjust-button{width:30px;height:30px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.08);border-radius:7px;background:rgba(255,255,255,.04);color:#aab2c2;cursor:pointer;transition:.2s}
        .adjust-button:hover{background:rgba(255,255,255,.09);color:#fff}
        .empty-inventory{padding:70px 20px;text-align:center;color:#6c7589}
        .empty-inventory-icon{margin-bottom:10px;color:#b4a7df;font-size:32px}
        .empty-inventory strong{display:block;color:#aeb6c7;font-size:13px}
        .empty-inventory span{display:block;margin-top:5px;font-size:10px}
        .inventory-overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(2,4,10,.72);z-index:1000}
        .inventory-overlay.show{display:flex}
        .inventory-modal{width:min(620px,100%);max-height:85vh;overflow:auto;padding:26px;border:1px solid rgba(255,255,255,.1);border-radius:20px;background:linear-gradient(135deg,rgba(25,28,45,.98),rgba(14,17,30,.98));box-shadow:0 30px 80px rgba(0,0,0,.45)}
        .inventory-modal h3{margin-top:7px;font-family:"Playfair Display",Georgia,serif;font-size:25px}
        .inventory-modal p{margin-top:5px;color:#70798d;font-size:10px}
        .modal-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:20px}
        .modal-button{min-height:40px;padding:0 18px;border-radius:9px;font-size:10px;font-weight:700;cursor:pointer}
        .modal-cancel{border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.04);color:#aeb6c7}
        .modal-save{border:none;background:linear-gradient(135deg,#fff,#D4AF37);color:#0B5D3B}
        .stock-product-name{margin:20px 0;padding:13px;border:1px solid rgba(255,255,255,.07);border-radius:9px;background:rgba(255,255,255,.025);color:#fff;font-size:11px;font-weight:700}
        .stock-label{display:block;margin-bottom:7px;color:#8992a6;font-size:9px;font-weight:700;letter-spacing:.8px;text-transform:uppercase}
        .stock-input{width:100%;height:44px;padding:0 12px;border:1px solid rgba(255,255,255,.09);border-radius:9px;outline:none;background:rgba(255,255,255,.045);color:#fff;font-size:12px}
        .stock-input:focus{border-color:rgba(212,175,55,.4)}
        .history-list{margin-top:20px}
        .history-item{display:grid;grid-template-columns:95px 1fr auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid rgba(255,255,255,.06)}
        .history-item:last-child{border-bottom:none}
        .history-action{font-size:9px;font-weight:800;text-transform:uppercase}
        .history-action.add{color:#6ee7b7}
        .history-action.remove{color:#fb7185}
        .history-action.sale{color:#D4AF37}
        .history-action.set{color:#fbbf24}
        .history-info strong{display:block;color:#eef0f5;font-size:10px}
        .history-info span{display:block;margin-top:3px;color:#687186;font-size:9px}
        .history-qty{color:#fff;font-size:11px;font-weight:800}
        .history-empty{padding:40px;text-align:center;color:#697287;font-size:10px}
        .history-clear{margin-right:auto;border:1px solid rgba(251,113,133,.16);background:rgba(251,113,133,.06);color:#fb7185}
        @media(max-width:1200px){.inventory-stats{grid-template-columns:repeat(3,1fr)}}
        @media(max-width:1000px){.inventory-panel{overflow-x:auto}.inventory-table{min-width:1050px}}
        @media(max-width:700px){.inventory-page{padding:25px 20px}.inventory-heading{flex-direction:column;align-items:flex-start}.inventory-refresh{width:100%}.inventory-stats{grid-template-columns:1fr}.inventory-toolbar{flex-direction:column}.inventory-filter,.history-button{width:100%}.history-item{grid-template-columns:75px 1fr auto}}
    </style>

    <div class="inventory-overlay" id="receiptModal">
        <div class="inventory-modal">
            <span class="eyebrow">RENT RECEIPT</span>
            <h3 id="receiptTitle">Receipts</h3>
            <p id="receiptSubtitle"></p>
            <div id="receiptBody"></div>
            <div class="modal-actions">
                <button type="button" class="modal-button modal-cancel" id="closeReceipt">Close</button>
            </div>
        </div>
    </div>

    <script src="../js/app.js"></script>
    <script src="../js/rent.js"></script>
    <script>
    (function() {
        const R = window.FeuRent;
        const session = R.getSession();
        const role = R.normalizedRole(session);
        if (!session || role !== "administrator") {
            window.location.href = role === "superadmin" ? "stores.html" : "../index.html";
            return;
        }

        const $ = function(id) { return document.getElementById(id); };
        let currentPeriod = R.periodKey();
        let viewingPeriod = null;

        function myStore() {
            return R.getStores().find(function(store) { return store.ownerId === session.id; }) || null;
        }

        function statusNote(status, store, key) {
            const due = R.dueDateFor(store, key);
            const days = R.daysUntil(due);
            if (status === "paid") return '<div class="rent-status-note">Payment confirmed by the school administrator. Thank you!</div>';
            if (status === "review") return '<div class="rent-status-note warn">Your receipt was submitted and is waiting for the school administrator to confirm it.</div>';
            if (status === "overdue") return '<div class="rent-status-note bad">This rent was due on ' + R.formatDate(due) + ". Please pay and upload your receipt as soon as possible.</div>";
            if (days <= 7) return '<div class="rent-status-note warn">Rent is due ' + (days <= 0 ? "today" : "in " + days + " day" + (days === 1 ? "" : "s")) + " (" + R.formatDate(due) + ").</div>";
            return '<div class="rent-status-note">Next payment is due on ' + R.formatDate(due) + ".</div>";
        }

        function render() {
            const store = myStore();
            const host = $("rentContent");
            if (!store) {
                $("rentSubtitle").textContent = "No store is linked to this account yet.";
                host.innerHTML = '<div class="inventory-panel"><div class="empty-inventory"><div class="empty-inventory-icon">&#8962;</div><strong>No store assigned</strong><span>Please contact the school administrator to link your account to a store.</span></div></div>';
                return;
            }

            const periods = R.periodsFor(store);
            if (periods.indexOf(currentPeriod) === -1) currentPeriod = periods[0];
            const status = R.statusFor(store, currentPeriod);
            const payment = R.getPayment(store, currentPeriod);
            const due = R.dueDateFor(store, currentPeriod);
            $("rentSubtitle").textContent = store.name + " \u2022 Monthly rent " + R.formatMoney(store.rentAmount) + ", due every month on day " + store.dueDay + ".";

            const card = function(label, value, small) {
                return '<div class="inventory-stat"><div class="inventory-stat-label">' + label + '</div><div class="inventory-stat-value">' + value + '</div><div class="inventory-stat-small">' + small + "</div></div>";
            };

            const history = periods.map(function(key) {
                const s = R.statusFor(store, key);
                const p = R.getPayment(store, key);
                return "<tr><td><strong>" + R.periodLabel(key) + "</strong></td>" +
                    "<td>" + R.formatDate(R.dueDateFor(store, key)) + "</td>" +
                    '<td><span class="inventory-price">' + R.formatMoney(store.rentAmount) + "</span></td>" +
                    '<td><span class="status-badge ' + R.statusClass(s) + '">' + R.statusLabel(s) + "</span></td>" +
                    "<td>" + (p.receipts.length ? '<button class="rent-btn" type="button" data-view="' + key + '">View (' + p.receipts.length + ")</button>" : '<span class="panel-note">None</span>') + "</td></tr>";
            }).join("");

            host.innerHTML =
                '<div class="rent-summary">' +
                    card("MONTHLY RENT", R.formatMoney(store.rentAmount), "Amount to pay") +
                    card("DUE DATE", R.formatDate(due), R.periodLabel(currentPeriod)) +
                    card("STATUS", '<span class="status-badge ' + R.statusClass(status) + '" style="font-size:12px">' + R.statusLabel(status) + "</span>", payment.paid && payment.paidAt ? "Paid " + new Date(payment.paidAt).toLocaleDateString("en-US") : "Set by school administrator") +
                    card("RECEIPTS", payment.receipts.length, "Uploaded for this month") +
                "</div>" +

                '<div class="inventory-panel">' +
                    '<div class="rent-period-row"><label class="stock-label" for="periodSelect" style="margin:0">Rent month</label>' +
                    '<select id="periodSelect" class="inventory-filter">' + periods.map(function(key) {
                        return '<option value="' + key + '"' + (key === currentPeriod ? " selected" : "") + ">" + R.periodLabel(key) + "</option>";
                    }).join("") + "</select></div>" +
                    statusNote(status, store, currentPeriod) +
                    (payment.paid
                        ? ""
                        : '<div class="rent-upload-box" style="margin-top:16px">' +
                            '<label class="stock-label" for="receiptFile">Upload proof of payment (image or PDF)</label>' +
                            '<input id="receiptFile" class="rent-file-input" type="file" accept="image/*,application/pdf">' +
                            '<div class="rent-form-grid" style="margin-top:0">' +
                                '<div><label class="stock-label" for="receiptReference">Reference no. (optional)</label><input id="receiptReference" class="stock-input" type="text"></div>' +
                                '<div><label class="stock-label" for="receiptNote">Note (optional)</label><input id="receiptNote" class="stock-input" type="text"></div>' +
                            "</div>" +
                            '<div class="rent-error" id="uploadError"></div>' +
                            '<div><button type="button" class="modal-button modal-save" id="uploadReceipt">Submit Receipt</button></div>' +
                        "</div>") +
                    (payment.receipts.length ? '<div style="margin-top:16px"><button type="button" class="rent-btn" data-view="' + currentPeriod + '">View uploaded receipts</button></div>' : "") +
                "</div>" +

                '<div class="inventory-panel"><h3 style="margin:0 0 10px;font-size:16px;color:#0B5D3B">Payment History</h3>' +
                    '<table class="inventory-table"><thead><tr><th>Month</th><th>Due Date</th><th>Amount</th><th>Status</th><th>Receipt</th></tr></thead><tbody>' + history + "</tbody></table></div>";

            $("periodSelect").addEventListener("change", function() { currentPeriod = $("periodSelect").value; render(); });
            const uploadButton = $("uploadReceipt");
            if (uploadButton) uploadButton.addEventListener("click", upload);
        }

        async function upload() {
            const error = $("uploadError");
            error.classList.remove("show");
            const button = $("uploadReceipt");
            try {
                button.disabled = true;
                button.textContent = "Uploading...";
                const receipt = await R.fileToReceipt($("receiptFile").files[0], $("receiptNote").value, $("receiptReference").value);
                const stores = R.getStores();
                const store = stores.find(function(item) { return item.ownerId === session.id; });
                if (!store) throw new Error("No store is linked to this account.");
                R.ensurePayment(store, currentPeriod).receipts.push(receipt);
                if (!R.saveStores(stores)) {
                    R.ensurePayment(store, currentPeriod).receipts.pop();
                    throw new Error("Could not save the receipt.");
                }
                render();
            } catch (err) {
                error.textContent = err.message || "Upload failed.";
                error.classList.add("show");
                button.disabled = false;
                button.textContent = "Submit Receipt";
            }
        }

        function openReceipts(key) {
            const store = myStore();
            if (!store) return;
            viewingPeriod = key;
            $("receiptTitle").textContent = store.name;
            $("receiptSubtitle").textContent = R.periodLabel(key) + " \u2022 Rent " + R.formatMoney(store.rentAmount);
            $("receiptBody").innerHTML = R.receiptsHTML(R.getPayment(store, key).receipts);
            $("receiptModal").classList.add("show");
        }

        $("rentContent").addEventListener("click", function(event) {
            const button = event.target.closest("[data-view]");
            if (button) openReceipts(button.getAttribute("data-view"));
        });
        $("receiptBody").addEventListener("click", function(event) {
            const button = event.target.closest("[data-open-receipt]");
            const store = myStore();
            if (!button || !store || !viewingPeriod) return;
            const receipt = R.getPayment(store, viewingPeriod).receipts.find(function(item) { return item.id === button.getAttribute("data-open-receipt"); });
            if (receipt) R.openDataUrl(receipt.data);
        });
        $("closeReceipt").addEventListener("click", function() { $("receiptModal").classList.remove("show"); });
        $("receiptModal").addEventListener("click", function(event) { if (event.target === this) this.classList.remove("show"); });
        window.addEventListener("storage", function(event) { if (event.key === R.STORES_KEY) render(); });

        render();
    })();
    </script>

</body>
